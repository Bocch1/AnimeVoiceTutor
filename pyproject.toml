[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-voice-tutor"
version = "0.13.1"
description = "Local-first Japanese conversation practice with ASR and optional TTS"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110", "uvicorn>=0.30", "httpx>=0.27",
    "pydantic>=2", "python-dotenv>=1", "python-multipart>=0.0.9",
    "numpy>=1.26", "soundfile>=0.12",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["voice_tutor*", "services*"]
