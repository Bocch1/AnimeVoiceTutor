name: Source tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Source structure verification
        run: python scripts/verify_public_source.py
      - name: Tests (no models or private data)
        run: python -m pytest -q
